<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moodle Quiz Solver</title>
    <link href="../vendor/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css" />
    <script src="./popup.js" defer></script>
    <script src="./theme.js"></script>
  </head>
  <body>
    <div class="container-fluid p-3" style="width: 22rem">
      <div id="popup-root">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Quiz Solver</h5>
          <div id="credits-badge" class="badge bg-secondary">—</div>
        </div>

        <div id="config-form" style="display: none;">
          <div class="mb-3">
            <label for="api-key" class="form-label">API Key</label>
            <input type="password" id="api-key" class="form-control form-control-sm" placeholder="Enter API key" />
          </div>
          <div class="mb-3">
            <label for="model" class="form-label">Model</label>
            <select id="model" class="form-select form-select-sm"></select>
            <div id="model-loading" class="form-text">Loading models...</div>
          </div>
          <div class="mb-3">
            <label for="reasoning" class="form-label">Reasoning</label>
            <select id="reasoning" class="form-select form-select-sm">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="context" class="form-label">Context</label>
            <textarea id="context" class="form-control form-control-sm" rows="3" placeholder="Optional context for answers"></textarea>
          </div>
          <div class="d-grid gap-2">
            <button id="save-btn" class="btn btn-primary btn-sm">Save</button>
          </div>
        </div>

        <div id="setup-view" class="text-center py-3">
          <i class="fas fa-key fa-2x mb-2 text-muted"></i>
          <p class="mb-2">Enter your API key to get started.</p>
          <button id="setup-btn" class="btn btn-primary btn-sm">Configure</button>
        </div>
      </div>
    </div>
  </body>
</html>
